name: clienthunt
description: "ClientHunt — B2B lead generation for local businesses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management (theme mode in A1, data layer from prompt C).
  flutter_riverpod: ^3.5.0
  # Declarative routing with a bottom-navigation shell.
  go_router: ^18.1.4
  # Plus Jakarta Sans, Inter and JetBrains Mono.
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons: generated from assets/client_hunt.png.
# Regenerate after changing the artwork with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/client_hunt.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
