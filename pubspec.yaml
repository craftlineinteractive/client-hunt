name: clienthunt
description: "ClientHunt — B2B lead generation for local businesses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management (theme mode, providers, data layer).
  flutter_riverpod: ^3.5.0
  # Declarative routing with a bottom-navigation shell.
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Fonts are bundled, never fetched at runtime. Each family is a variable font
  # declared once per weight the app uses; AppTypography pins the `wght` axis so
  # the rendered weight matches the token. Licenses: assets/fonts/README.md.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
          weight: 500

# Launcher icons: generated from assets/client_hunt.png.
# Regenerate after changing the artwork with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/client_hunt.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
